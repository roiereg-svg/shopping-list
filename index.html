<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>רשימת הקניות עברה</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2; url=https://kniyot.roieregev.com/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #F3F5EF; --surface: #FFFFFF; --ink: #1C2620; --muted: #5E6A62; --line: #DCE2D6; --accent: #1737D8; --accent-ink: #FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121814; --surface: #1B231E; --ink: #E7ECE6; --muted: #A0ACA4; --line: #2C3730; --accent: #6F86FF; --accent-ink: #0B1030; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Assistant", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px 16px; }
  main { max-width: 420px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: 1.4rem; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  a.go { display: block; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; padding: 14px; border-radius: 12px; }
  a.go:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>רשימת הקניות עברה לאפליקציה חדשה</h1>
  <p>מעבירים אתכם עכשיו. אם זה לא קורה, לחצו על הכפתור.</p>
  <a class="go" href="https://kniyot.roieregev.com/">מעבר לאפליקציה החדשה</a>
  <p>כדאי למחוק את האייקון הישן ולהתקין את החדש מהאפליקציה החדשה.</p>
</main>
<script>
  // The old app was retired: clear what it cached on this phone, then move on.
  // The old share link (#join=...) is dropped on purpose; the new app has its own invites.
  (async () => {
    try { for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister(); } catch {}
    try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
    try { localStorage.removeItem("shoppingList.v1"); localStorage.removeItem("shoppingList.installLater"); } catch {}
    location.replace("https://kniyot.roieregev.com/");
  })();
</script>
</body>
</html>
